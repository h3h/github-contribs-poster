    start: 2012
    end: 2014-04

  - title: Last Guide
    start: 2014-05
    end: 2014-11

  - title: Under Armour
    subtitle: Engineer career growth
    start: 2015
    end: 2020-08

  - title: SailPoint
    start: 2020-09
    end: 2023-07

  - title: Praxis
