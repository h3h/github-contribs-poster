# Career eras, shaded behind the yearly bars on the poster.
#
# Each era has:
#   title:     a name, or a list of names (one per line), shown in caps
#   subtitle:  optional; a line, or a list of lines, shown smaller under the title
#   start:     YYYY, YYYY-MM, or YYYY-MM-DD (a year means Jan 1; a month means its 1st)
#   end:       same formats, inclusive (a year means Dec 31; a month means its last day);
#              leave it out for an era that is still going (only the last era)
#   languages: optional; a rough language mix for the era, as relative weights, e.g.
#              {Ruby: 70, JavaScript: 30}. It fills in the contributions that git history
#              can't attribute (see fetch_languages.py) and is drawn hatched as an estimate.
#
# List eras in date order; they must not overlap, but gaps are fine.
# Delete every entry (or this file) to render the poster with no eras.

eras:
  - title: Causes
    start: 2008
    end: 2010-10
    languages: {Ruby: 60, JavaScript: 25, CSS: 15}

  - title: Gowalla
    start: 2010-11
    end: 2011
    languages: {Ruby: 80, JavaScript: 20}

  - title: [Return Path, Uncommon]
    subtitle: Austin.rb
    start: 2012
    end: 2014-04
    languages: {Ruby: 60, CoffeeScript: 25, CSS: 15}

  - title: Last Guide
    start: 2014-05
    end: 2014-11
    languages: {Ruby: 100}

  - title: Under Armour
    subtitle: Engineer career growth
    start: 2015
    end: 2020-08
    languages: {Python: 50, Ruby: 30, JavaScript: 20}

  - title: SailPoint
    start: 2020-09
    end: 2023-07

  - title: Praxis
    start: 2023-08
    end: 2023-12

  - title: OMC
    subtitle: Agents
    start: 2024
